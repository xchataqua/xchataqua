name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-build:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        scheme:
          - XChat Aqua
          - XChat Azure

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Vendor Python framework
        run: |
          chmod +x ./tools/vendor_python_framework.sh
          ./tools/vendor_python_framework.sh

      - name: Build ${{ matrix.scheme }}
        run: |
          xcodebuild \
            -workspace XChatAqua.xcworkspace \
            -scheme "${{ matrix.scheme }}" \
            -configuration Debug \
            -destination "generic/platform=macOS" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64 x86_64" \
            CODE_SIGNING_ALLOWED=NO \
            build
